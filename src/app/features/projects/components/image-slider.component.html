<div class="image-slider" role="group" aria-roledescription="carrusel" aria-label="Capturas del proyecto"
  (mouseenter)="stopAutoSlide()" (mouseleave)="startAutoSlide()" (focusin)="stopAutoSlide()"
  (focusout)="startAutoSlide()">
  <div class="slider-wrapper" [style.transform]="'translateX(-' + currentIndex * 100 + '%)'">
    <img *ngFor="let img of images; let i = index" [src]="img"
      [alt]="altText + ' (' + (i + 1) + ' de ' + images.length + ')'" class="slider-image" loading="lazy"
      decoding="async" />
  </div>
  <button type="button" class="slider-control prev" (click)="prev()" aria-label="Captura anterior">&#10094;</button>
  <button type="button" class="slider-control next" (click)="next()" aria-label="Captura siguiente">&#10095;</button>
  <div class="slider-dots">
    <button type="button" *ngFor="let img of images; let i = index" (click)="goTo(i)" class="dot"
      [class.active]="i === currentIndex" [attr.aria-label]="'Ir a la captura ' + (i + 1)"
      [attr.aria-current]="i === currentIndex"></button>
  </div>
</div>
